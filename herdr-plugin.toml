id = "herdr.browser"
name = "Browser"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Navegador Chromium real (Brave por defecto) con control CDP y extensiones de Chrome, integrado a herdr."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Abrir en el navegador controlado"
contexts = ["global", "workspace", "pane"]
command = ["node", "bin/open-from-herdr.mjs"]

[[actions]]
id = "tabs"
title = "Pestañas del navegador"
contexts = ["global", "workspace", "pane"]
command = ["node", "bin/open-panel.mjs"]

[[panes]]
id = "tab-list"
title = "Browser tabs"
placement = "overlay"
command = ["node", "bin/panel.mjs"]

[[link_handlers]]
id = "open-url"
title = "Abrir en el navegador controlado"
pattern = "^https?://"
action = "open"
